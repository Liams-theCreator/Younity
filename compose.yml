services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: development
    image: younity-api:dev
    command: ["sh", "-c", "npm run db:setup && exec npm run start:dev"]
    init: true
    environment:
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:5173}
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL in root .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
          ignore:
            - generated/
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/package-lock.json
        - action: rebuild
          path: ./apps/api/prisma

        - action: rebuild
          path: ./apps/api/prisma7.config.ts

        - action: rebuild
          path: ./apps/api/tsconfig.json

        - action: rebuild
          path: ./apps/api/tsconfig.build.json

        - action: rebuild
          path: ./apps/api/nest-cli.json

        - action: rebuild
          path: ./apps/api/Dockerfile

        - action: sync
          path: ./apps/api/test
          target: /app/test
          initial_sync: true

        - action: sync
          path: ./apps/api/vitest.config.ts
          target: /app/vitest.config.ts
          initial_sync: true

        - action: sync
          path: ./apps/api/vitest.config.e2e.ts
          target: /app/vitest.config.e2e.ts
          initial_sync: true

        - action: sync
          path: ./apps/api/.oxlintrc.json
          target: /app/.oxlintrc.json
          initial_sync: true

  web:
    build:
      context: ./apps/web
      target: development
    image: younity-web:dev
    environment:
      API_PROXY_TARGET: http://api:3000
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
            - package-lock.json
            - Dockerfile
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
        - action: rebuild
          path: ./apps/web/Dockerfile

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config: