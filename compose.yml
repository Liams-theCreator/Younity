services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./apps/api
      target: development
    image: younity-api:dev
    init: true
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL in root .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
          initial_sync: true
          ignore:
            - generated/

        - action: rebuild
          path: ./apps/api/package.json

        - action: rebuild
          path: ./apps/api/package-lock.json

        - action: rebuild
          path: ./apps/api/prisma

volumes:
  postgres_data:
